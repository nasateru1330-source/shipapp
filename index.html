<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農産物出荷記録アプリ - shipapp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN (グラフ表示用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome (アイコン用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-emerald-50/50 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid font-bold text-2xl fa-wheat-awn text-amber-300"></i>
                <h1 class="text-xl font-bold tracking-wide">農産物出荷記録 shipapp</h1>
            </div>
            <div id="userInfo" class="hidden flex items-center gap-3">
                <img id="userAvatar" class="w-8 h-8 rounded-full border-2 border-white/80" src="" alt="User Avatar">
                <span id="userName" class="text-sm font-medium hidden sm:inline"></span>
                <button id="logoutBtn" class="bg-emerald-800 hover:bg-emerald-900 text-xs px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1 border border-emerald-600">
                    <i class="fa-solid fa-right-from-bracket"></i> ログアウト
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- ログイン前画面 -->
        <div id="loginSection" class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-xl text-center border border-emerald-100">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-tractor"></i>
            </div>
            <h2 class="text-2xl font-bold text-emerald-900 mb-2">実習の出荷・販売を記録</h2>
            <p class="text-slate-600 text-sm mb-6">Googleアカウントまたはゲストログインで、収穫した農産物の記録を開始しましょう。</p>
            
            <div class="space-y-3">
                <button id="loginBtn" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 border border-slate-300 rounded-xl shadow-sm hover:shadow transition-all flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Googleアカウントでログイン
                </button>

                <button id="anonLoginBtn" class="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-semibold py-2.5 px-4 rounded-xl border border-emerald-200 transition-all flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-user-clock"></i> ゲスト(匿名)として試用ログイン
                </button>
            </div>

            <!-- エラー表示エリア -->
            <div id="loginError" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-xs rounded-lg text-left leading-relaxed"></div>
        </div>

        <!-- ログイン後メインコンテンツ -->
        <div id="appSection" class="hidden space-y-6">
            
            <!-- 集計サマリー・グラフエリア (発展機能) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 合計集計カード -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 flex flex-col justify-between">
                    <div>
                        <h3 class="text-sm font-semibold text-slate-500 mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-chart-pie text-emerald-600"></i> 農産物別 集計 (合計)
                        </h3>
                        <div id="summaryList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                            <p class="text-xs text-slate-400">データがありません</p>
                        </div>
                    </div>
                </div>

                <!-- 出荷推移グラフ -->
                <div class="md:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                    <h3 class="text-sm font-semibold text-slate-500 mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-emerald-600"></i> 出荷数量の推移
                    </h3>
                    <div class="relative h-44">
                        <canvas id="shipmentChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                
                <!-- 登録・編集フォーム -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100 lg:col-span-1">
                    <div class="flex justify-between items-center mb-4">
                        <h2 id="formTitle" class="text-lg font-bold text-emerald-900 flex items-center gap-2">
                            <i class="fa-solid fa-plus-circle text-emerald-600"></i> 新規出荷登録
                        </h2>
                        <button id="cancelEditBtn" class="hidden text-xs text-slate-500 hover:text-slate-800 underline">
                            キャンセル
                        </button>
                    </div>

                    <!-- エラー・警告メッセージ -->
                    <div id="formError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl"></div>

                    <form id="shipmentForm" class="space-y-4" novalidate>
                        <input type="hidden" id="editDocId" value="">

                        <!-- 1. 農産物名 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">農産物名 <span class="text-red-500">*</span></label>
                            <input type="text" id="itemName" list="cropSuggestions" placeholder="例: トマト, キュウリ, 米" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <datalist id="cropSuggestions">
                                <option value="トマト">
                                <option value="ミニトマト">
                                <option value="キュウリ">
                                <option value="ナス">
                                <option value="イチゴ">
                                <option value="コシヒカリ">
                                <option value="ミカン">
                            </datalist>
                        </div>

                        <!-- 2. 出荷日 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">出荷日 <span class="text-red-500">*</span></label>
                            <input type="date" id="shipDate" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>

                        <!-- 3. 出荷数量 (単位付き) -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">出荷数量 <span class="text-red-500">*</span></label>
                            <div class="flex gap-2">
                                <input type="number" id="quantity" step="any" min="0.01" placeholder="例: 15.5" class="w-2/3 px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                <select id="unit" class="w-1/3 px-2 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                                    <option value="kg">kg</option>
                                    <option value="個">個</option>
                                    <option value="ケース">ケース</option>
                                    <option value="袋">袋</option>
                                    <option value="束">束</option>
                                </select>
                            </div>
                        </div>

                        <!-- 4. 出荷先 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">出荷先 <span class="text-red-500">*</span></label>
                            <select id="destination" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                                <option value="">選択してください</option>
                                <option value="直売所">直売所</option>
                                <option value="学校祭">学校祭</option>
                                <option value="給食">給食</option>
                                <option value="市場">市場</option>
                                <option value="校内販売">校内販売</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>

                        <!-- 5. メモ -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">メモ</label>
                            <textarea id="memo" rows="3" placeholder="実習時の気付きや品質、等級など" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                        </div>

                        <!-- 登録ボタン -->
                        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> <span id="submitBtnText">登録する</span>
                        </button>
                    </form>
                </div>

                <!-- 登録データ一覧 (発展機能: 絞り込み・並び替え) -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100 lg:col-span-2 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <h2 class="text-lg font-bold text-emerald-900 flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-emerald-600"></i> 出荷記録一覧
                        </h2>
                        
                        <!-- フィルタ・ソート機能 -->
                        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                            <!-- 農産物絞り込み -->
                            <select id="filterCrop" class="text-xs border border-slate-200 rounded-lg px-2.5 py-1.5 bg-slate-50 focus:outline-none">
                                <option value="">すべての農産物</option>
                            </select>

                            <!-- 日付ソート -->
                            <select id="sortOrder" class="text-xs border border-slate-200 rounded-lg px-2.5 py-1.5 bg-slate-50 focus:outline-none">
                                <option value="desc">日付: 新しい順</option>
                                <option value="asc">日付: 古い順</option>
                            </select>
                        </div>
                    </div>

                    <!-- リスト表示 -->
                    <div id="shipmentList" class="space-y-3 min-h-[200px]">
                        <p class="text-center text-slate-400 py-8 text-sm">データを読み込み中...</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- モーダルダイアログ (削除確認用/Alert代替) -->
    <div id="customModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4 transform transition-all">
            <div id="modalIcon" class="w-12 h-12 rounded-full bg-red-100 text-red-500 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-trash"></i>
            </div>
            <h3 id="modalTitle" class="text-base font-bold text-slate-800">削除の確認</h3>
            <p id="modalMessage" class="text-sm text-slate-600">この出荷記録を削除してもよろしいですか？</p>
            <div class="flex gap-2 pt-2">
                <button id="modalCancelBtn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-xl text-sm transition-colors">
                    キャンセル
                </button>
                <button id="modalConfirmBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-xl text-sm transition-colors">
                    削除する
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            signInAnonymously,
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc,

            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 提出要件指定の Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyBs1SXv2AAInlU_zLVvYRVR3jHyi_KALUE",
            authDomain: "tsuishi-540ef.firebaseapp.com",
            projectId: "tsuishi-540ef",
            storageBucket: "tsuishi-540ef.firebasestorage.app",
            messagingSenderId: "345041101165",
            appId: "1:345041101165:web:8d98a42c53e482cdc6ba64",
            measurementId: "G-2LRHQVS8KF"
        };

        // アプリケーション識別ID
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'shipapp';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // UI State Variables
        let currentUser = null;
        let shipments = [];
        let chartInstance = null;
        let docToDeleteId = null;

        // DOM Elements
        const loginSection = document.getElementById('loginSection');
        const appSection = document.getElementById('appSection');
        const userInfo = document.getElementById('userInfo');
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const loginBtn = document.getElementById('loginBtn');
        const anonLoginBtn = document.getElementById('anonLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginError = document.getElementById('loginError');

        // デフォルト日付を本日に設定
        shipDate.valueAsDate = new Date();

        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                userName.textContent = user.displayName || (user.isAnonymous ? 'ゲスト生徒' : 'ユーザー');
                userAvatar.src = user.photoURL || 'https://placehold.co/100x100/10b981/ffffff?text=User';
                
                loginSection.classList.add('hidden');
                userInfo.classList.remove('hidden');
                appSection.classList.remove('hidden');

                // データのリアルタイム監視開始
                initRealtimeListener();
            } else {
                currentUser = null;
                loginSection.classList.remove('hidden');
                userInfo.classList.add('hidden');
                appSection.classList.add('hidden');
                shipments = [];
            }
        });

        // Google ログイン
        loginBtn.addEventListener('click', async () => {
            loginError.classList.add('hidden');
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login failed:", error);
                if (error.code === 'auth/configuration-not-found') {
                    loginError.innerHTML = `
                        <strong>Firebase認証未設定エラー:</strong><br>
                        Firebase Consoleの「Authentication」→「Sign-in method」で <strong>Google ログインプロバイダを有効化</strong> してください。<br>
                        ※下部の「ゲストとして試用ログイン」ボタンでテスト実行も可能です。
                    `;
                } else if (error.code === 'auth/unauthorized-domain') {
                    const currentHost = window.location.hostname;
                    loginError.innerHTML = `
                        <strong>未承認ドメインエラー (auth/unauthorized-domain):</strong><br>
                        現在ご利用のドメイン（<code class="bg-red-100 font-mono px-1 rounded">${currentHost}</code>）が Firebase で許可されていません。<br><br>
                        <strong>解決方法:</strong><br>
                        1. <a href="https://console.firebase.google.com/" target="_blank" class="underline font-bold">Firebase Console</a> を開く<br>
                        2. <strong>Authentication</strong> ＞ <strong>設定 (Settings)</strong> ＞ <strong>承認済みドメイン</strong> を開く<br>
                        3. 「ドメインを追加」をクリックし、<code class="bg-red-100 font-mono px-1 rounded">${currentHost}</code> を登録してください。
                    `;
                } else {
                    loginError.textContent = `ログインエラー: ${error.message}`;
                }
                loginError.classList.remove('hidden');
            }
        });

        // 匿名（ゲスト）ログインのフォールバック処理
